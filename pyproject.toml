[project]
name = "triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diego Restrepo", email = "restrepomesadiego@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "logfire>=4.22.0",
    "lsp-client>=0.3.9",
    "pydantic-ai-slim[openai]>=1.56.0",
    "pyrefly>=0.52.0",
    "pyright>=1.1.408",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
triage = "triage:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.mypy]
[[tool.mypy.overrides]]
module = "lsp_client.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]
